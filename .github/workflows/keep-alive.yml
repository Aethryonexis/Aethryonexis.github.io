name: keep-backend-warm

# Pings the Render free-tier backend so it does not cold-start for real visitors.
# Lives in the PUBLIC frontend repo on purpose: public repos get unlimited free
# Actions minutes (the private backend repo would burn its 2000/mo budget).
#
# Setup: add a repo secret KEEPALIVE_TOKEN (Settings -> Secrets and variables ->
# Actions) equal to the backend's KEEPALIVE_TOKEN env var.
#
# Note: GitHub's scheduler can be delayed under load. For tighter guarantees, add a
# free external monitor (e.g. UptimeRobot / cron-job.org) hitting the same /health URL.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-backend-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /health
        env:
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 120 --retry 3 --retry-delay 15 --retry-connrefused \
            -H "x-keepalive-token: ${KEEPALIVE_TOKEN}" \
            https://aethryonexis-backend.onrender.com/health || echo "000")
          echo "HTTP ${code}"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::warning::backend health check returned ${code}"
          fi
